name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Send email if tests fail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failed: Tests failed on ${{ github.repository }} (${{ github.ref_name }})"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: "The pytest suite failed in workflow run ${{ github.run_id }}. Check GitHub Actions for details."

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Private Registry
        if: success()
        uses: docker/login-action@v3
        with:
          registry: registry.example.com
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Build and push to multiple registries
        if: success()
        run: |
          DOCKERHUB_IMAGE="${{ secrets.DOCKER_USERNAME }}/flaskapp:${{ github.sha }}"
          PRIVATE_IMAGE="registry.example.com/flaskapp:${{ github.sha }}"

          docker build -t "$DOCKERHUB_IMAGE" -t "$PRIVATE_IMAGE" .
          docker push "$DOCKERHUB_IMAGE"
          docker push "$PRIVATE_IMAGE"